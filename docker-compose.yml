version: "3.9"
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mtik-linktest-backend
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - PORT=4000
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: mtik-linktest-web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:4000
    depends_on:
      - backend
    restart: unless-stopped
